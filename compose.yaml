services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cms
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms -d cms"]
      interval: 2s
      timeout: 3s
      retries: 30
  migrate:
    build: .
    entrypoint: ["/app/migrate"]
    command: ["-seed"]
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cms?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    build: .
    environment:
      DATABASE_URL: postgres://cms:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/cms?sslmode=disable
      HTTP_ADDR: :8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4101}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
